<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#333d00">
  <title>燒酎掃掃看</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- 最底層：相機畫面＋浮動卡（MindAR 會把 video 和 renderer 放進來，不能 display:none） -->
  <div id="ar"></div>

  <!-- 辨識畫面上的提示與按鈕：瞄準框和提示在認到酒標時一起淡出 -->
  <div id="scan-ui" class="scan-ui hidden">
    <div class="aim" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
    <p class="hint">對準主打商品架上的酒標</p>
  </div>
  <button id="close" class="close hidden" type="button" aria-label="結束掃描"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3L15 15M15 3L3 15"/></svg></button>
  <div id="loading" class="loading hidden">
    <svg class="ochoko" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <clipPath id="ochoko-clip">
          <path d="M21 22C21 39 23 52.5 28 60.5C30.5 66 38 68 50 68C62 68 69.5 66 72 60.5C77 52.5 79 39 79 22Z"/>
        </clipPath>
      </defs>
      <g clip-path="url(#ochoko-clip)">
        <path id="liquid" fill="var(--liquid)"/>
        <path id="liquid-top" fill="none" stroke="var(--liquid-top)" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <path fill="currentColor" d="M16 22C16 40 18 55 24 64C27 71 36 73 50 73C64 73 73 71 76 64C82 55 84 40 84 22H79C79 39 77 52.5 72 60.5C69.5 66 62 68 50 68C38 68 30.5 66 28 60.5C23 52.5 21 39 21 22ZM32 70V80H68V70Z"/>
    </svg>
    <p id="loading-text">相機啟動中…</p>
  </div>

  <!-- 初始頁 -->
  <section id="start" class="start">
    <div class="deco" aria-hidden="true"><i class="joka"></i></div>
    <div class="start-inner">
      <h1><svg class="title-bottle" viewBox="8 1 8 22" fill="currentColor" aria-hidden="true"><path d="M11.2 1.5h1.6a.3.3 0 0 1 .3.3V8c0 2.5 2.4 2.5 2.4 5v8.7a.8.8 0 0 1-.8.8h-5.4a.8.8 0 0 1-.8-.8V13c0-2.5 2.4-2.5 2.4-5V1.8a.3.3 0 0 1 .3-.3z"/></svg>燒酎掃掃看</h1>
      <div class="start-body">
        <p class="lead">用手機相機對準燒酎酒標，酒款介紹就會浮現在酒瓶旁邊。</p>
        <ol class="steps">
          <li>按下「開始掃描」，允許使用相機</li>
          <li>對準主打架上的酒標</li>
          <li>點一下浮出來的卡片，看完整介紹</li>
        </ol>
        <div id="notice" class="notice hidden" role="alert"></div>
        <button id="start-btn" class="primary" type="button" disabled>載入中…</button>
        <p class="privacy">相機畫面只在你的手機上處理，不會上傳。</p>
      </div>
    </div>
  </section>

  <!-- 酒款資訊（全螢幕）：內容可以捲動，「繼續掃描」固定在下方 -->
  <section id="sheet" class="sheet hidden" aria-labelledby="sheet-name">
    <div class="sheet-body">
      <h2 id="sheet-name" class="sheet-name"></h2>
      <p class="sheet-brewery" data-field="brewery"></p>
      <p class="sheet-reading" data-field="reading"></p>
      <p class="meta" data-field="meta"></p>
      <ul class="tags" data-field="tags"></ul>
      <h3>風味</h3>
      <p class="flavor" data-field="flavor"></p>
      <h3>建議喝法</h3>
      <p data-field="serving"></p>
    </div>
    <div class="sheet-actions">
      <button id="sheet-close" class="primary" type="button">繼續掃描</button>
    </div>
  </section>

  <footer class="warning">理性飲酒‧飲酒過量有害健康</footer>

  <div id="debug" class="debug hidden"></div>

  <template id="float-tpl">
    <div class="float-anchor">
      <button class="float-card" type="button">
        <span class="float-title"><b data-field="name"></b><small data-field="brewery"></small></span>
        <span class="float-meta" data-field="meta"></span>
        <span class="tags" data-field="tags"></span>
        <span class="float-more" aria-hidden="true">›</span>
      </button>
    </div>
  </template>
</body>
</html>
